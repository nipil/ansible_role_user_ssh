---
- name: Validate role inputs
  ansible.builtin.import_tasks: validation.yml

- name: Setup authorized_keys for user
  ansible.posix.authorized_key:
    user: "{{ user_ssh_name }}"
    state: present
    exclusive: "{{ user_ssh_keys_replace }}"
    key: |
      {% for user_ssh_key in user_ssh_keys %}
      {{ user_ssh_key }}
      {% endfor %}

- name: Ensure authorized_keys exists when no keys are configured
  when: user_ssh_keys | length == 0
  block:
    - name: Resolve home directory for {{ user_ssh_name }}
      ansible.builtin.getent:
        database: passwd
        key: "{{ user_ssh_name }}"
      register: user_ssh_home

    - name: Create .ssh directory in home of {{ user_ssh_name }}
      ansible.builtin.file:
        path: "{{ user_ssh_home.ansible_facts.getent_passwd[user_ssh_name][4] }}/.ssh"
        state: directory
        owner: "{{ user_ssh_name }}"
        mode: "700"

    - name: Create authorized_keys file
      ansible.builtin.file:
        path: "{{ user_ssh_home.ansible_facts.getent_passwd[user_ssh_name][4] }}/.ssh/authorized_keys"
        state: touch
        owner: "{{ user_ssh_name }}"
        mode: "600"

- name: Prepare sshd_config snippet to allow user
  notify: Reload sshd - role {{ role_name }}
  ansible.builtin.copy:
    content: "AllowUsers {{ user_ssh_name }}"
    dest: "{{ user_ssh_sshd_config_d }}/{{ user_ssh_name }}.conf"
    owner: root
    group: root
    mode: "644"
